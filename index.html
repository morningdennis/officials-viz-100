<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>官员履历数据</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f6f4ee; --card:#fffefb; --text:#2d2418; --text2:#8c8273;
  --text3:#b8ad9c; --border:#e0d9cc; --accent:#8b6914;
  --header-bg:#3d3226; --header-text:#f0e9db;
  --lvl-fgj:#b83230;--lvl-fgj-bg:#fdf2f2;
  --lvl-zbj:#c06d1f;--lvl-zbj-bg:#fef8f2;
  --lvl-fbj:#b38b2c;--lvl-fbj-bg:#fefce8;
  --lvl-zting:#5d8a4e;--lvl-zting-bg:#f4faf2;
  --lvl-fting:#5e7d9a;--lvl-fting-bg:#f4f7fa;
  --lvl-cji:#7b5ea7;--lvl-cji-bg:#f8f5fc;
  --lvl-zgj:#b83230;--lvl-zgj-bg:#fdf2f2;
  --tk-tiao:#b35d3a;--tk-tiao-bg:#fef5f0;
  --tk-kuai:#5d8a4e;--tk-kuai-bg:#f4faf2;
}
body{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","PingFang SC","Microsoft YaHei",serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.7}

/* ── Top bar ── */
.topbar{background:var(--header-bg);color:var(--header-text);padding:16px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,0.2);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:2px}
.topbar .count{font-size:13px;opacity:.55}
.topbar .spacer{flex:1}
.topbar input,.topbar select{padding:8px 14px;border:1px solid rgba(255,255,255,.12);border-radius:3px;font-size:14px;background:rgba(255,255,255,.08);color:var(--header-text);outline:none;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.topbar input::placeholder{color:rgba(255,255,255,.3)}
.topbar select{cursor:pointer}
.topbar select option{background:var(--header-bg);color:var(--header-text)}

/* ── Stats ── */
.stats-bar{padding:12px 32px;background:var(--card);border-bottom:1px solid var(--border);display:flex;gap:24px;flex-wrap:wrap;font-size:14px;color:var(--text2)}
.stats-bar b{color:var(--text);font-weight:600}
.stats-bar .sep{color:var(--text3)}
.stats-bar .right{flex:1;display:flex;gap:8px;justify-content:flex-end}
.stats-bar button{font-size:12px;padding:4px 14px;cursor:pointer;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text2);font-family:inherit;transition:all .15s}
.stats-bar button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── Page content ── */
.page-content{max-width:1400px;margin:0 auto;padding:24px 40px 40px}

/* ── Person card ── */
.person-card{background:var(--card);border:1px solid var(--border);border-radius:6px;margin-bottom:32px;box-shadow:0 1px 4px rgba(0,0,0,.04);overflow:hidden}
.person-header{background:#f9f7f1;padding:20px 28px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.person-header h2{font-size:22px;font-weight:700;letter-spacing:1px;color:var(--text)}
.person-header .bio-line{font-size:15px;color:var(--text2);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.person-header .bio-line .sep{color:var(--text3);margin:0 2px}
.person-header .badges{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.badge{font-size:12px;padding:3px 12px;border-radius:3px;font-weight:600;letter-spacing:.5px;white-space:nowrap}
.badge-origin{background:#f5f0e0;color:#8b6914}
.badge-edu{background:#f4f7fa;color:#5e7d9a}
.badge-party{background:#fdf2f2;color:#b83230}
.badge-rows{background:#f4faf2;color:#5d8a4e}
.badge-multi{background:#fefce8;color:#b38b2c}
.badge-sex{background:#faf2f8;color:#8b3a6b}

/* ── Table inside card ── */
.person-table{width:100%;border-collapse:collapse}
.person-table thead th{background:#f5f2eb;padding:10px 14px;text-align:left;font-weight:600;font-size:12px;color:var(--text2);border-bottom:2px solid var(--border);letter-spacing:.5px;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.person-table tbody td{padding:10px 14px;border-bottom:1px solid #f0ede4;vertical-align:top;font-size:14px}
.person-table tbody tr:hover{background:#fdf9f0}
.person-table tbody tr.row-meta td{font-size:13px;color:var(--text3);font-style:italic;background:#fafaf8}

/* Column widths */
.col-years{min-width:80px;white-space:nowrap;font-size:13px;color:var(--text2);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.col-content{min-width:300px}
.col-level{min-width:100px;white-space:nowrap;text-align:center}
.col-tiaokuai{min-width:72px;text-align:center;font-weight:600}
.col-dept{min-width:110px;font-size:13px}
.col-location{min-width:72px;white-space:nowrap;font-size:13px}
.col-source{min-width:48px;text-align:center}
.col-jiaoliu{min-width:52px;text-align:center}

/* Tags */
.lvl-tag{display:inline-block;padding:4px 12px;border-radius:3px;font-size:13px;font-weight:700;letter-spacing:.5px}
.lvl-fgj{background:var(--lvl-fgj-bg);color:var(--lvl-fgj)}
.lvl-zbj{background:var(--lvl-zbj-bg);color:var(--lvl-zbj)}
.lvl-fbj{background:var(--lvl-fbj-bg);color:var(--lvl-fbj)}
.lvl-zting{background:var(--lvl-zting-bg);color:var(--lvl-zting)}
.lvl-fting{background:var(--lvl-fting-bg);color:var(--lvl-fting)}
.lvl-cji{background:var(--lvl-cji-bg);color:var(--lvl-cji)}

.tk-tag{display:inline-block;padding:4px 12px;border-radius:3px;font-size:13px;font-weight:700;letter-spacing:1px}
.tk-tiao{background:var(--tk-tiao-bg);color:var(--tk-tiao)}
.tk-kuai{background:var(--tk-kuai-bg);color:var(--tk-kuai)}

.src-star{color:#b38b2c}
.jiaoliu-icon{color:#b35d3a}
.src-link{color:var(--accent);text-decoration:none;font-size:12px}
.src-link:hover{text-decoration:underline}
.empty-cell{color:var(--text3)}

/* ── Pagination ── */
.pagination{display:flex;align-items:center;justify-content:center;gap:16px;padding:24px 32px 40px;font-size:15px;color:var(--text2);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.pagination button{padding:9px 22px;border:1px solid var(--border);border-radius:3px;background:var(--card);cursor:pointer;font-size:14px;color:var(--text);font-family:inherit;transition:all .15s}
.pagination button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.pagination button:disabled{opacity:.25;cursor:default}
.pagination button:disabled:hover{background:var(--card);color:var(--text);border-color:var(--border)}
.pagination .page-num{font-weight:600;color:var(--text);font-size:16px}
.pagination select{padding:8px 14px;border:1px solid var(--border);border-radius:3px;font-size:14px;background:var(--card);color:var(--text);cursor:pointer;font-family:inherit}

/* ── No results ── */
.no-results{text-align:center;padding:80px 20px;color:var(--text3);font-size:18px}

@media(max-width:768px){
  .topbar{flex-direction:column;align-items:stretch;padding:12px 16px}
  .page-content{padding:16px}
  .person-header{flex-direction:column;gap:8px}
  .person-header .badges{margin-left:0}
  .col-content{min-width:180px}
}
</style>
</head>

var LEVEL_CLASS = {
  '正国级':'lvl-zgj','副国级':'lvl-fgj','正部级':'lvl-zbj',
  '副部级':'lvl-fbj','正厅局级':'lvl-zting','副厅局级':'lvl-fting','处级及以下':'lvl-cji'
};

var state = {search:'',levelFilter:'',tkFilter:'',page:0,perPage:5};

function doFilter() {
  state.search = document.getElementById('search').value;
  state.levelFilter = document.getElementById('level-filter').value;
  state.tkFilter = document.getElementById('tk-filter').value;
  state.page = 0;
  renderAll();
}

function changePerPage() {
  state.perPage = parseInt(document.getElementById('per-page').value);
  state.page = 0;
  renderAll();
}

function renderAll() {
  var q = state.search.toLowerCase();
  var lq = state.levelFilter;
  var tq = state.tkFilter;

  var filtered = PEOPLE.filter(function(p) {
    if (lq) {
      var hasLevel = p.career.some(function(r){ return (r['行政级别']||'') === lq; });
      if (!hasLevel) return false;
    }
    if (tq) {
      var hasTk = p.career.some(function(r){ return (r['条块']||'') === tq; });
      if (!hasTk) return false;
    }
    if (q) {
      var hay = p['姓名'].toLowerCase();
      for (var i = 0; i < p.career.length; i++) {
        var r = p.career[i];
        hay += ' ' + (r['职务内容']||'') + ' ' + (r['部门_一级']||'') + ' ' + (r['部门_二级']||'') + ' ' + (r['工作地']||'') + ' ' + (r['行政级别']||'') + ' ' + (r['条块']||'');
      }
      if (hay.toLowerCase().indexOf(q) < 0) return false;
    }
    return true;
  });

  var displayPeople = filtered.map(function(p) {
    var clone = Object.assign({}, p);
    if (lq) {
      clone.career = p.career.filter(function(r){ return (r['行政级别']||'') === lq; });
    }
    if (tq) {
      clone.career = (clone.career || p.career).filter(function(r){ return (r['条块']||'') === tq; });
    }
    return clone;
  });

  var totalPeople = displayPeople.length;
  var totalPages = Math.ceil(totalPeople / state.perPage);
  if (state.page >= totalPages) state.page = Math.max(0, totalPages - 1);
  var start = state.page * state.perPage;
  var pagePeople = displayPeople.slice(start, start + state.perPage);

  var totalRows = 0, multiRows = 0;
  displayPeople.forEach(function(p) {
    p.career.forEach(function(r) {
      totalRows++;
      if (r['多源佐证'] === '1') multiRows++;
    });
  });
  document.getElementById('row-count').textContent = totalPeople + ' 人 · ' + totalRows + ' 行';

  var allRows = [];
  displayPeople.forEach(function(p) { allRows = allRows.concat(p.career); });
  var tiao = allRows.filter(function(r){return r['条块']==='条';}).length;
  var kuai = allRows.filter(function(r){return r['条块']==='块';}).length;
  document.getElementById('stats-bar').innerHTML =
    '<span>👥 <b>'+totalPeople+'</b> 人</span><span class="sep">|</span>' +
    '<span>📊 <b>'+totalRows+'</b> 行</span><span class="sep">|</span>' +
    '<span>⭐ 多源 <b>'+multiRows+'</b> ('+(totalRows?(multiRows/totalRows*100).toFixed(0):0)+'%)</span><span class="sep">|</span>' +
    '<span>条 <b>'+tiao+'</b> · 块 <b>'+kuai+'</b></span>' +
    '<span class="right"><b>第 '+(state.page+1)+'</b> / '+totalPages+' 页</span>';

  if (pagePeople.length === 0) {
    document.getElementById('page-content').innerHTML = '<div class="no-results">没有匹配结果</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  var html = '';
  for (var i = 0; i < pagePeople.length; i++) {
    html += renderPerson(pagePeople[i]);
  }
  document.getElementById('page-content').innerHTML = html;

  var pageHtml = '';
  pageHtml += '<button '+(state.page<=0?'disabled':'')+' onclick="goPage('+(state.page-1)+')">← 前页</button>';
  pageHtml += '<span class="page-num">第 '+(state.page+1)+' 页</span>';
  pageHtml += '<button '+(state.page>=totalPages-1?'disabled':'')+' onclick="goPage('+(state.page+1)+')">后页 →</button>';
  pageHtml += '<select onchange="goPage(parseInt(this.value))">';
  for (var p=0; p<totalPages; p++) pageHtml += '<option value="'+p+'"'+(p===state.page?' selected':'')+'>跳到第 '+(p+1)+' 页</option>';
  pageHtml += '</select>';
  document.getElementById('pagination').innerHTML = pageHtml;
}

    h += '<td class="col-content">'+esc(r['职务内容'])+'</td>';
    h += '<td class="col-level">'+(level?'<span class="lvl-tag '+lvlCls+'">'+esc(level)+'</span>':'<span class="empty-cell">—</span>')+'</td>';
    h += '<td class="col-tiaokuai">'+(tk?('<span class="tk-tag '+tkCls+'">'+esc(tk)+'</span>'):'<span class="empty-cell">—</span>')+'</td>';
    h += '<td class="col-dept">'+esc(r['部门_一级'])+'</td>';
    h += '<td class="col-dept">'+esc(r['部门_二级'])+'</td>';
    h += '<td class="col-location">'+esc(r['工作地'])+'</td>';
    h += '<td class="col-jiaoliu">'+(isJl?'<span class="jiaoliu-icon">🔄</span>':'')+'</td>';
    h += '<td class="col-source">'+(isMulti?'<span class="src-star">⭐</span>':'')+'</td>';
    h += '<td class="col-source">'+(hasSrc?'<a class="src-link" href="'+escAttr(srcUrl)+'" target="_blank">'+esc(srcCount)+'</a>':esc(srcCount))+'</td>';
    h += '</tr>';
  }

  h += '</tbody></table></div>';
  return h;
}

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escAttr(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

function goPage(p){state.page=Math.max(0,p);renderAll();scrollTo(0,0)}

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'&&!e.target.closest('input,select'))goPage(state.page-1);
  if(e.key==='ArrowRight'&&!e.target.closest('input,select'))goPage(state.page+1);
});

renderAll();

</script>
</body></html>
